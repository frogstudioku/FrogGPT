<!doctype html><html lang="id" data-theme="dark"><head><meta charset="utf-8"><title>FrogGPT</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<link rel="stylesheet" href="style.css"></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></symbol>
<symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
<symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></symbol>
<symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></symbol>
<symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></symbol>
<symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
<symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></symbol>
<symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></symbol>
</defs></svg>
<aside id="side">
  <div class="brand"><img class="mark" src="logo.png" alt=""><span>FrogGPT</span></div>
  <button class="cta" id="new"><svg class="i"><use href="#i-plus"/></svg>Chat baru</button>
  <nav>
    <button class="nav on" data-view="chats"><svg class="i"><use href="#i-chat"/></svg>Chat</button>
    <button class="nav" data-view="projects"><svg class="i"><use href="#i-folder"/></svg>Proyek</button>
    <button class="nav" data-view="artifacts"><svg class="i"><use href="#i-layers"/></svg>Artefak</button>
  </nav>
  <div class="label">Terbaru</div><div id="recents"></div>
  <button class="nav" id="settingsBtn"><svg class="i"><use href="#i-sliders"/></svg>Pengaturan</button>
</aside>
<main>
  <header class="topbar">
    <button class="round" id="toggle" title="Bilah samping"><svg class="i"><use href="#i-menu"/></svg></button>
    <div class="right"><span id="status" class="pill"></span>
      <button class="round" id="theme" title="Ganti tema gelap/terang"><svg class="i ic-sun"><use href="#i-sun"/></svg><svg class="i ic-moon"><use href="#i-moon"/></svg></button></div>
  </header>
  <section id="view"></section>
  <form id="composer" autocomplete="off">
    <textarea id="input" rows="1" placeholder="Ceritakan brief, minta moodboard, atau kritik desainmu"></textarea>
    <div class="bar"><span id="modeChip" class="chip"></span><button id="send" class="send" title="Kirim"><svg class="i"><use href="#i-up"/></svg></button></div>
  </form>
</main>
<dialog id="dlg"></dialog>
<script src="app.js"></script></body></html>
