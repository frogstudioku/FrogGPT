<!doctype html><html lang="id"><head><meta charset="utf-8"><title>FrogGPT</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<link rel="stylesheet" href="style.css"></head><body>
<aside id="side">
  <div class="top"><button class="icon" id="toggle" title="Tutup bilah samping">☰</button><span class="logo">FrogGPT</span></div>
  <button class="nav primary" id="new">＋ Chat baru</button>
  <nav>
    <button class="nav" data-view="chats">Chat</button>
    <button class="nav" data-view="projects">Proyek</button>
    <button class="nav" data-view="artifacts">Artefak</button>
  </nav>
  <div class="label">Terbaru</div><div id="recents"></div>
  <button class="nav profile" id="settingsBtn">⚙ Pengaturan</button>
</aside>
<main>
  <div id="status"></div>
  <section id="view"></section>
  <form id="composer" autocomplete="off">
    <textarea id="input" rows="1" placeholder="Ceritakan brief, minta moodboard, atau kritik desainmu"></textarea>
    <div class="bar"><span id="modeChip" class="chip"></span><button id="send" class="send" title="Kirim">↑</button></div>
  </form>
</main>
<dialog id="dlg"></dialog>
<script src="app.js"></script></body></html>
