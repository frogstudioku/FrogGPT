name: Build Windows EXE
on:
  push: { tags: ['v*'] }
  workflow_dispatch:
permissions: { contents: write }
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run build-kb
      - run: npm run dist
      - name: Rincian ukuran
        shell: bash
        run: |
          du -sh dist/win-unpacked/resources/* 2>/dev/null || true
          du -sh dist/win-unpacked/resources/app.asar.unpacked/node_modules/@node-llama-cpp/* 2>/dev/null || true
          du -sh dist/win-unpacked 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with: { name: FrogGPT-win, path: dist/*.exe }
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with: { files: dist/*.exe }
